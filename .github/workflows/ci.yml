name: CI

on:
  push:
    branches: [main]
  pull_request:

# The runner image is pinned rather than `ubuntu-latest`. The floating label
# migrates to a new Ubuntu release on its own schedule, and an image change that
# turns this red is indistinguishable from a change in the code that did it.
# Bumping the pin is a deliberate commit, so the diff says which it was.
jobs:
  #
  # Each event-loop backend gets built and tested on a platform that selects
  # it: epoll on the Linux compilers, kqueue on macOS, and poll() forced on
  # Linux, since no platform here would pick the fallback on its own.
  build:
    name: build (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - compiler: clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - compiler: gcc, poll() fallback
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            extra: -DTCPTAP_FORCE_POLL=ON
          - compiler: macOS clang
            os: macos-15
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Install ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTCPTAP_WERROR=ON -DBUILD_TESTING=ON ${{ matrix.extra }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DTCPTAP_WERROR=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-asan
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  # There is deliberately no clang-tidy job yet. `./scripts/dev.sh ci --strict`
  # does not cover every job above, and that is expected rather than a gap to
  # close: a machine builds only the backend its own platform selects (plus
  # `poll()` with `-DTCPTAP_FORCE_POLL=ON`). On the Linux machine that runs
  # the gate, that is `build (gcc)`, `build (clang)`, and
  # `build (gcc, poll() fallback)`, which together cover the `epoll` and
  # `poll()` backends. `build (macOS clang)` selects `kqueue` instead, which
  # nothing on this machine can build, so that job is CI-only; a change to
  # the kqueue backend should be built there before it is relied on. The
  # sanitizer, format and shellcheck jobs below are platform-agnostic, so the
  # local gate does cover those in full. clang-tidy needs Homebrew's llvm on
  # the dev machine; it gets wired in once that is installed, rather than
  # standing here as a check the local gate cannot see. `docs/CONVENTIONS.md`'s
  # CI section states the same distinction for human contributors reading this
  # repo outside CI, and this comment should keep matching it rather than
  # drift back to claiming every job here runs locally.

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: clang-format --dry-run --Werror src/proxy/tap.cpp src/proxy/event_loop.h src/testing/echo_server.cpp src/testing/send_client.cpp

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell
        run: shellcheck scripts/*.sh tests/*.sh .githooks/commit-msg
